<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse INC</title>

    <link rel="manifest" href="src/manifest.json" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <!-- Font Awesome CSS -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  </head>
  <body>
    <div id="autoplayPopup" style="display: none">
      Autoplay is disabled for this site. Click
      <a
        onclick="bgMusic.play();document.getElementById('autoplayPopup').classList.add('autoplayPopupLeave')"
        >here</a
      >
      to play background music.
    </div>
    <div id="bgscroll"></div>
    <div id="container">
      <h1>Welcome to Warehouse INC</h1>
      <p>Embark on an epic adventure in the world of warehousing!</p>

      <button data-switch-to="game">
        <i class="fas fa-play icon"><span class="buttonText">Play</span></i>
      </button>
      <button data-switch-to="credits">
        <i class="fas fa-info-circle icon"
          ><span class="buttonText">Credits</span></i
        >
      </button>
    </div>

    <div id="crapOfTheDay">
      <span style="font-size: 4vmin; color: #a6a7cf">Quote of the minute:</span
      ><br />
      <span id="crapContents" style="font-size: 3vmin"></span>
    </div>

    <script src="/src/home.js" type="module"></script>
  </body>
</html>
